name: ht-m5

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.156.0
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=1y
    ports:
      - "127.0.0.1:18428:8428"
    volumes:
      - "${HT_STATE:-/home/sentimentalk/.local/state/host-telemetry}/m5/vmdata:/victoria-metrics-data"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=1y
    ports:
      - "127.0.0.1:19428:9428"
    volumes:
      - "${HT_STATE:-/home/sentimentalk/.local/state/host-telemetry}/m5/vlogsdata:/victoria-logs-data"
    restart: unless-stopped

  grafana:
    profiles: ["grafana"]
    image: grafana/grafana:12.2.0
    user: "0:0"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "${HT_STATE:-/home/sentimentalk/.local/state/host-telemetry}/m5/grafana:/var/lib/grafana"
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - victoriametrics
    restart: unless-stopped
